<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1240" viewBox="0 0 980 1240" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4458"/>
    </marker>
    <style>
      .page   { fill:#ffffff; stroke:#6c5ce7; stroke-width:2.5; rx:14; }
      .popup  { fill:#fff4f7; stroke:#ff5e8a; stroke-width:2.5; stroke-dasharray:7 5; }
      .decide { fill:#e8fbf5; stroke:#0ea47a; stroke-width:2.5; }
      .label  { font-size:22px; fill:#1a1a2e; text-anchor:middle; font-weight:600; }
      .sub    { font-size:17px; fill:#6b6779; text-anchor:middle; }
      .edge   { stroke:#4a4458; stroke-width:2.2; fill:none; marker-end:url(#arrow); }
      .edge-d { stroke:#ff5e8a; stroke-width:2.2; fill:none; stroke-dasharray:6 5; marker-end:url(#arrow); }
      .etitle { font-size:18px; fill:#4a4458; text-anchor:middle; }
      .note   { font-size:18px; fill:#6b6779; }
      .title  { font-size:32px; font-weight:800; fill:#1a1a2e; }
    </style>
  </defs>

  <rect width="980" height="1240" fill="#f7f6fb"/>
  <text x="40" y="56" class="title">交互流程图 · 2026 校园星光音乐节报名宣传 H5</text>
  <text x="40" y="90" class="note">实线＝页面跳转（点击触发）　虚线＝弹窗显示／关闭　弹窗不计入独立页面</text>

  <!-- P1 -->
  <rect x="340" y="130" width="300" height="92" class="page" rx="14"/>
  <text x="490" y="168" class="label">P1 封面</text>
  <text x="490" y="198" class="sub">点击「进入活动」</text>

  <!-- P2 -->
  <rect x="300" y="300" width="380" height="104" class="page" rx="14"/>
  <text x="490" y="342" class="label">P2 活动介绍（分支选择页）</text>
  <text x="490" y="374" class="sub">三个分支按钮 · 倒计时</text>

  <!-- P3 P4 P5 -->
  <rect x="30" y="520" width="280" height="100" class="page" rx="14"/>
  <text x="170" y="560" class="label">P3 活动详情</text>
  <text x="170" y="592" class="sub">时间 / 场地 / 须知入口</text>

  <rect x="350" y="520" width="280" height="100" class="page" rx="14"/>
  <text x="490" y="560" class="label">P4 演出阵容</text>
  <text x="490" y="592" class="sub">6 张嘉宾卡片</text>

  <rect x="670" y="520" width="280" height="100" class="page" rx="14"/>
  <text x="810" y="560" class="label">P5 报名表单</text>
  <text x="810" y="592" class="sub">姓名 / 手机号 / 意向区域</text>

  <!-- 弹窗 A B -->
  <rect x="30" y="720" width="280" height="100" class="popup" rx="14"/>
  <text x="170" y="760" class="label">弹窗A 报名须知</text>
  <text x="170" y="792" class="sub">点击「我知道了」关闭</text>

  <rect x="350" y="720" width="280" height="100" class="popup" rx="14"/>
  <text x="490" y="760" class="label">弹窗B 嘉宾详情</text>
  <text x="490" y="792" class="sub">点击「关闭」/ 遮罩关闭</text>

  <!-- 校验 -->
  <polygon points="810,710 950,775 810,840 670,775" class="decide"/>
  <text x="810" y="768" class="label">必填校验</text>
  <text x="810" y="798" class="sub">手机号格式</text>

  <!-- P6 -->
  <rect x="640" y="960" width="310" height="100" class="page" rx="14"/>
  <text x="795" y="1000" class="label">P6 报名成功反馈页</text>
  <text x="795" y="1032" class="sub">生成回执编号 · 返回首页</text>

  <!-- 校验不通过回 P5 -->
  <path d="M 880 760 L 980 760 L 980 570 L 952 570" class="edge"/>
  <text x="920" y="740" class="etitle">不通过</text>
  <text x="920" y="700" class="etitle">停留P5提示</text>

  <!-- 音频注释 -->
  <rect x="30" y="960" width="420" height="130" fill="#eef0ff" stroke="#6c5ce7" stroke-width="2" rx="14"/>
  <text x="52" y="1000" class="label" style="text-anchor:start">全局：音频控制</text>
  <text x="52" y="1034" class="note">右上角音乐按钮，任意页面可播放 / 暂停，</text>
  <text x="52" y="1064" class="note">可反复操作（程序合成背景音乐）</text>

  <!-- 边 -->
  <path d="M 490 222 L 490 296" class="edge"/>

  <path d="M 420 404 L 170 516" class="edge"/>
  <text x="235" y="452" class="etitle">活动详情</text>

  <path d="M 490 404 L 490 516" class="edge"/>
  <text x="530" y="470" class="etitle">演出阵容</text>

  <path d="M 560 404 L 810 516" class="edge"/>
  <text x="740" y="452" class="etitle">立即报名</text>

  <path d="M 170 620 L 170 716" class="edge-d"/>
  <text x="200" y="676" class="etitle">查看须知</text>

  <path d="M 490 620 L 490 716" class="edge-d"/>
  <text x="530" y="676" class="etitle">点击卡片</text>

  <path d="M 810 620 L 810 706" class="edge"/>
  <text x="845" y="676" class="etitle">提交报名</text>

  <path d="M 810 840 L 795 956" class="edge"/>
  <text x="850" y="906" class="etitle">通过</text>

  <path d="M 640 1010 L 240 1010 L 240 1180 L 490 1180 L 490 240 L 490 226" class="edge"/>
  <text x="300" y="1150" class="etitle">「返回首页」回到 P1</text>
</svg>
